# MMSI pattern -> category label, used by MMSIPatternClassifier.
#
# Patterns per Recommendation ITU-R M.585-10 (04/2026), "Assignment and use of identities in
# the maritime mobile service":
# https://www.itu.int/dms_pubrec/itu-r/rec/m/R-REC-M.585-10-202604-I!!PDF-E.pdf
#
# A pattern is matched as a leading-digits prefix of the (9-digit) MMSI, longest match wins.
# Most categories in Annex 1/2 are a fixed prefix followed by the 3-digit Maritime
# Identification Digits (MID) of the assigning administration and/or a serial number - the
# prefix alone identifies the category regardless of which MID follows. A pattern can also be
# a full 9 digits, in which case it only matches that one exact MMSI - see
# "all-coast-stations" below. A plain ship station has no such fixed pattern (its first 3
# digits *are* the MID, Annex 1 S1), so it is left unmapped here and falls back to
# `default_category` - see examples/run_pipeline.py.
#
# Quote every pattern - unquoted, YAML would parse a leading-zero pattern like "00" as an
# octal number rather than the string "00".
#
# "0" and "00" don't collide in practice: MMSIPatternClassifier matches the longest pattern
# first, so a coast station (00-MID-XXXX) always matches "00" before "0" - and even without
# that, every ITU-assigned MID starts with a digit 2-7, so a genuine group-ship-call number's
# second digit is never 0 in the first place.
"0": group-ship-call                     # Annex 1, Section 1 §4:  0-MID-XXXX
"00": coast-station                      # Annex 1, Section 2 §1:  00-MID-XXXX
"009990000": all-coast-stations          # Annex 1, Section 2 §8:  fixed identity, not a MID
                                          # range - reserved to address every 00MIDXXXX
                                          # station (VHF only)
"111": sar-aircraft                      # Annex 1, Section 3 §1:  111-MID-XXX
"98": craft-associated-with-parent-ship  # Annex 1, Section 5 §1:  98-MID-XXXX
"99": aid-to-navigation                  # Annex 1, Section 4 §1:  99-MID-XXXX
"8": handheld-vhf-transceiver            # Annex 2, Section 1 §3:  8-MID-XXXXX
"970": ais-sart                          # Annex 2, Section 2 §1:  970-XXYYYY
"972": man-overboard-device              # Annex 2, Section 2 §2:  972-XXYYYY
"974": epirb-ais                         # Annex 2, Section 2 §3:  974-XXYYYY
"979": amrd-group-b                      # Annex 2, Section 2 §5.2: 979-YYYYYY
